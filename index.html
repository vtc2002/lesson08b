<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思辨之窗 - 互動挑戰</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #2c3e50;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 4px solid #fff;
        }
        h1 {
            text-align: center;
            color: #ff4757;
            font-size: 2.5em;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffeaa7;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .intro {
            text-align: center;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 25px;
            background: #ff6b81;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            font-size: 1.2em;
            border: 2px solid #fff;
            line-height: 1.5;
        }
        .intro-sub {
            font-size: 0.75em;
            display: block;
            margin-top: 5px;
            font-weight: normal;
            opacity: 0.95;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .question-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: 3px solid #eccc68;
            transition: transform 0.3s ease;
        }
        .question-card:nth-child(2) { border-color: #ff6b81; }
        .question-card:nth-child(3) { border-color: #4cd137; }
        .question-card:nth-child(4) { border-color: #00a8ff; }
        .question-card:nth-child(5) { border-color: #9c88ff; }
        .question-card:nth-child(6) { border-color: #ff9f43; }

        .question-title {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2f3542;
            display: flex;
            align-items: center;
        }
        .question-title::before {
            content: "💡";
            margin-right: 10px;
            font-size: 1.2em;
        }
        
        /* 拖曳排序樣式 */
        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sortable-item {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: grab;
            display: flex;
            align-items: center;
            font-size: 1.15em;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #0061a8, 0 4px 10px rgba(0,0,0,0.15);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .sortable-item:active {
            cursor: grabbing;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0061a8;
        }
        .sortable-item.dragging {
            opacity: 0.3;
        }
        .sortable-item::before {
            content: '✋ 拖曳排序';
            margin-right: 20px;
            font-size: 0.8em;
            background: rgba(255,255,255,0.25);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* 繽紛遊戲化選擇題樣式 */
        .game-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .game-options label {
            position: relative;
            cursor: pointer;
            display: block;
        }
        .game-options input[type="radio"] {
            position: absolute;
            opacity: 0;
        }
        
        /* 不同題目的彩色按鈕配色彩虹感 */
        #q2-card .option-box { background: #fff; border: 3px solid #ff4757; color: #ff4757; box-shadow: 0 6px 0 #ff2137; }
        #q2-card input[type="radio"]:checked ~ .option-box { background: #ff4757; color: white; }
        
        #q3-card .option-box { background: #fff; border: 3px solid #2ed573; color: #2ed573; box-shadow: 0 6px 0 #26af5f; }
        #q3-card input[type="radio"]:checked ~ .option-box { background: #2ed573; color: white; }
        
        #q4-card .option-box { background: #fff; border: 3px solid #1e90ff; color: #1e90ff; box-shadow: 0 6px 0 #1c7cd8; }
        #q4-card input[type="radio"]:checked ~ .option-box { background: #1e90ff; color: white; }
        
        #q5-card .option-box { background: #fff; border: 3px solid #ffa502; color: #ffa502; box-shadow: 0 6px 0 #e69500; }
        #q5-card input[type="radio"]:checked ~ .option-box { background: #ffa502; color: white; }

        .option-box {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.15em;
            font-weight: bold;
            transition: all 0.15s ease-in-out;
            text-align: center;
            min-height: 52px;
        }
        .game-options label:hover .option-box {
            transform: translateY(-3px);
        }
        /* 點擊選中時的壓下動態 */
        .game-options input[type="radio"]:checked ~ .option-box {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent !important;
        }

        /* 送出按鈕 */
        button.submit-btn {
            display: block;
            width: 100%;
            padding: 20px;
            font-size: 1.6em;
            color: #fff;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 8px 0 #cf3a47, 0 10px 20px rgba(255, 71, 87, 0.3);
            margin-top: 35px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #cf3a47, 0 12px 25px rgba(255, 71, 87, 0.4);
        }
        button.submit-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 transparent;
        }

        /* 結果顯示區 */
        #result-area {
            display: none;
            margin-top: 30px;
            padding: 35px;
            border-radius: 24px;
            background-color: #fff;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            text-align: center;
            border: 4px solid #2ed573;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .score-display {
            font-size: 3.5em;
            font-weight: bold;
            color: #2ed573;
            margin: 15px 0;
            text-shadow: 2px 2px 0px #f1f2f6;
        }
        .feedback {
            margin-top: 25px;
            text-align: left;
            font-size: 1.15em;
            background: #f1f2f6;
            padding: 25px;
            border-radius: 16px;
            border-left: 6px solid #2ed573;
        }
        .feedback ul { list-style-type: none; padding: 0; }
        .feedback li { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px dashed #ced6e0; }
        .correct { color: #2ed573; font-weight: bold; }
        .incorrect { color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>✨ 思辨之窗 ✨</h1>
        <p class="intro">
            📢 看示範 ‧ 學討論 ‧ 練思辨
            <span class="intro-sub">🎮 規則：答對得 2 分，答錯扣 1 分。點擊彩色方塊挑戰吧！</span>
        </p>

        <div id="quiz-form">
            <!-- 第一題：排序題 -->
            <div class="question-card" id="q1-card">
                <div class="question-title">1. 根據討論者的表現，按優劣排出先後名次（請按住滑鼠上下拖曳調整順序，優秀的排在最上方）：</div>
                <ul class="sortable-list" id="sortable-list">
                    <li class="sortable-item" draggable="true" data-id="1">1號徐世安</li>
                    <li class="sortable-item" draggable="true" data-id="2">2號秦守時</li>
                    <li class="sortable-item" draggable="true" data-id="3">3號莫重讀</li>
                    <li class="sortable-item" draggable="true" data-id="4">4號當勞親</li>
                    <li class="sortable-item" draggable="true" data-id="5">5號談正音</li>
                </ul>
            </div>

            <!-- 第二題：選擇題 -->
            <div class="question-card" id="q2-card">
                <div class="question-title">2. 小組討論分幾部分？</div>
                <div class="game-options">
                    <label><input type="radio" name="q2" value="A"><div class="option-box">A. 一部分</div></label>
                    <label><input type="radio" name="q2" value="B"><div class="option-box">B. 兩部分</div></label>
                    <label><input type="radio" name="q2" value="C"><div class="option-box">C. 三部分</div></label>
                </div>
            </div>

            <!-- 第三題：選擇題 -->
            <div class="question-card" id="q3-card">
                <div class="question-title">3. 個人發言時間，每人有多少分鐘？</div>
                <div class="game-options">
                    <label><input type="radio" name="q3" value="A"><div class="option-box">A. 1分鐘</div></label>
                    <label><input type="radio" name="q3" value="B"><div class="option-box">B. 2分鐘</div></label>
                </div>
            </div>

            <!-- 第四題：選擇題 -->
            <div class="question-card" id="q4-card">
                <div class="question-title">4. 自由討論階段，5人小組，全組共有多少分鐘的討論時間？</div>
                <div class="game-options">
                    <label><input type="radio" name="q4" value="A"><div class="option-box">A. 5分鐘</div></label>
                    <label><input type="radio" name="q4" value="B"><div class="option-box">B. 6分鐘</div></label>
                </div>
            </div>

            <!-- 第五題：選擇題 -->
            <div class="question-card" id="q5-card">
                <div class="question-title">5. 以下哪項不是評分項目？</div>
                <div class="game-options">
                    <label><input type="radio" name="q5" value="A"><div class="option-box">A. 內容組織</div></label>
                    <label><input type="radio" name="q5" value="B"><div class="option-box">B. 語言功能</div></label>
                    <label><input type="radio" name="q5" value="C"><div class="option-box">C. 語言運用</div></label>
                    <label><input type="radio" name="q5" value="D"><div class="option-box">D. 語音面貌</div></label>
                    <label><input type="radio" name="q5" value="E"><div class="option-box">E. 穿著打扮</div></label>
                </div>
            </div>

            <button class="submit-btn" onclick="calculateScore()">🚀 送出答案．結算戰績 🚀</button>
        </div>

        <!-- 結果顯示區 -->
        <div id="result-area">
            <h2>🎉 挑戰完成！ 🎉</h2>
            <div class="score-display"><span id="total-score">0</span> / 10 分</div>
            <div class="feedback" id="feedback-details"></div>
            <button class="submit-btn" style="background: linear-gradient(135deg, #00a8ff 0%, #0097e6 100%); box-shadow: 0 8px 0 #007cc0;" onclick="location.reload()">🔄 再挑戰一次</button>
        </div>
    </div>

    <script>
        // 拖曳排序邏輯
        const sortableList = document.getElementById('sortable-list');
        let draggedItem = null;

        sortableList.addEventListener('dragstart', (e) => {
            draggedItem = e.target;
            setTimeout(() => e.target.classList.add('dragging'), 0);
        });

        sortableList.addEventListener('dragend', (e) => {
            setTimeout(() => e.target.classList.remove('dragging'), 0);
            draggedItem = null;
        });

        sortableList.addEventListener('dragover', (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(sortableList, e.clientY);
            const currentItem = document.querySelector('.dragging');
            if (afterElement == null) {
                sortableList.appendChild(currentItem);
            } else {
                sortableList.insertBefore(currentItem, afterElement);
            }
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.sortable-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // 計分邏輯
        function calculateScore() {
            let score = 0;
            let feedbackHTML = '<h3>📊 戰情即時回報：</h3><ul>';

            // 第一題排序驗證 (52413 或 52143 都不扣分且算對)
            const currentOrder = [...document.querySelectorAll('.sortable-item')].map(item => item.getAttribute('data-id')).join('');
            if (currentOrder === '52413' || currentOrder === '52143') {
                score += 2;
                feedbackHTML += '<li class="correct">🤩 第 1 題 (排序)：名次排列完全正確！太厲害了！(+2分)</li>';
            } else {
                score -= 1;
                feedbackHTML += `<li class="incorrect">😢 第 1 題 (排序)：名次排錯囉。正確順序應為 5,2,4,1,3 或 5,2,1,4,3 (-1分)</li>`;
            }

            // 正確答案對照表
            const answers = {
                'q2': 'B', // 兩部分
                'q3': 'A', // 1分鐘
                'q4': 'B', // 6分鐘 (已更新為B)
                'q5': 'E'  // 穿著打扮
            };

            const textAnswers = {
                'q2': 'B. 兩部分',
                'q3': 'A. 1分鐘',
                'q4': 'B. 6分鐘',
                'q5': 'E. 穿著打扮'
            };

            // 檢查第二到五題
            for (let i = 2; i <= 5; i++) {
                const qName = 'q' + i;
                const selected = document.querySelector(`input[name="${qName}"]:checked`);
                
                if (selected) {
                    if (selected.value === answers[qName]) {
                        score += 2;
                        feedbackHTML += `<li class="correct">🎯 第 ${i} 題：答對了！累積能量中！(+2分)</li>`;
                    } else {
                        score -= 1;
                        feedbackHTML += `<li class="incorrect">💥 第 ${i} 題：答錯了，正確答案是【${textAnswers[qName]}】(-1分)</li>`;
                    }
                } else {
                    feedbackHTML += `<li class="incorrect">⚠️ 第 ${i} 題：忘記作答了，視同挑戰失敗 (-1分)</li>`;
                    score -= 1;
                }
            }

            feedbackHTML += '</ul>';

            // 隱藏題目，顯示結果
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('total-score').innerText = score;
            document.getElementById('feedback-details').innerHTML = feedbackHTML;
            
            // 滾動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
